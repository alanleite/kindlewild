<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cartas · Kindlewild</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="barra">
    <div class="barra-titulo">
      <h1>Cartas do Kindlewild</h1>
      <span id="resumo" class="resumo" role="status" aria-live="polite"></span>
      <span id="aviso-trilho" class="aviso" hidden></span>
    </div>
    <div class="controles">
      <label>Folha
        <select id="seletor-pagina" disabled></select>
      </label>
      <label>Habilidades liberadas
        <select id="seletor-habilidades">
          <option value="1" selected>1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
      </label>
      <button id="botao-imprimir" type="button" disabled>Imprimir selecionados</button>
      <nav class="links"><a href="legenda.html">Legenda</a></nav>
    </div>
  </header>

  <section class="painel-selecao" aria-labelledby="titulo-selecao">
    <div class="selecao-cabecalho">
      <div>
        <h2 id="titulo-selecao">Escolher criaturas</h2>
        <span id="resumo-selecao" class="resumo-selecao" role="status" aria-live="polite"></span>
      </div>
      <div class="selecao-acoes">
        <label class="busca-criatura" for="busca-criatura">Buscar
          <input id="busca-criatura" type="search" placeholder="Nome ou número" autocomplete="off">
        </label>
        <button id="selecionar-todos" class="botao-secundario" type="button" disabled>Selecionar todos</button>
        <button id="limpar-selecao" class="botao-secundario" type="button" disabled>Limpar seleção</button>
      </div>
    </div>
    <div id="lista-criaturas" class="lista-criaturas" aria-label="Criaturas disponíveis"></div>
  </section>

  <main>
    <div id="mensagem" class="mensagem" role="alert" hidden></div>
    <div id="paginas"></div>
  </main>

  <script src="icones.js?v=20261004-1" defer></script>
  <script src="cenario-web.js" defer></script>
  <script src="escala-imagens.js" defer></script>
  <script src="selecao-impressao.js" defer></script>
  <script src="apresentacao-carta.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
