<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cards · Kindlewild</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <div class="bar-title">
      <h1>Kindlewild cards</h1>
      <span id="summary" class="summary" role="status" aria-live="polite"></span>
      <span id="track-warning" class="warning" hidden></span>
    </div>
    <div class="controls">
      <label>Sheet
        <select id="sheet-select" disabled></select>
      </label>
      <label>Unlocked skills
        <select id="skills-select">
          <option value="1" selected>1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
      </label>
      <button id="print-button" type="button" disabled>Print selected</button>
      <nav class="links"><a href="battle.html">Battle board</a> · <a id="legend-link" href="legend.html">Legend</a></nav>
    </div>
  </header>

  <form id="data-form" class="data-form">
    <label for="data-url">Creature database URL</label>
    <input id="data-url" type="url" placeholder="https://example.com/creatures.json" required>
    <button type="submit" class="button-secondary">Load database</button>
    <button id="reset-data" type="button" class="button-secondary">Use example</button>
    <p>Use a public HTTPS JSON URL that allows cross-origin access. The URL appears in the address bar; do not include secrets.</p>
  </form>

  <section class="selection-panel" aria-labelledby="selection-title">
    <div class="selection-header">
      <div>
        <h2 id="selection-title">Choose creatures</h2>
        <span id="selection-summary" class="selection-summary" role="status" aria-live="polite"></span>
      </div>
      <div class="selection-actions">
        <label class="creature-search" for="creature-search">Search
          <input id="creature-search" type="search" placeholder="Name or number" autocomplete="off">
        </label>
        <button id="select-all" class="button-secondary" type="button" disabled>Select all</button>
        <button id="clear-selection" class="button-secondary" type="button" disabled>Clear selection</button>
      </div>
    </div>
    <div id="creature-list" class="creature-list" aria-label="Available creatures"></div>
  </section>

  <main>
    <div id="message" class="message" role="alert" hidden></div>
    <div id="pages"></div>
  </main>

  <script src="icons.js?v=20261004-1" defer></script>
  <script src="resistances.js" defer></script>
  <script src="scenario-web.js" defer></script>
  <script src="image-scale.js" defer></script>
  <script src="print-selection.js" defer></script>
  <script src="card-view.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
