name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Publication guard
        run: node scripts/check-publication.js
      - name: Build the site
        run: |
          mkdir -p _site/scenarios
          cp page/index.html _site/
          cp -r site _site/site
          cp scenarios/default.txt _site/scenarios/
          for s in scenarios/*/; do
            id=$(basename "$s")
            if node -e "process.exit(require('./$s/scenario.json').private === false ? 0 : 1)"; then
              mkdir -p "_site/scenarios/$id"
              cp "$s"scenario.json "$s"creatures.json "$s"types.json "_site/scenarios/$id/"
              if [ -d "$s"images ]; then cp -r "$s"images "_site/scenarios/$id/"; fi
            fi
          done
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
