name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Trava de publicação
        run: node scripts/checar-publicacao.js
      - name: Testes do núcleo
        run: |
          npm ci
          npm test
      - name: Testes do Foundry
        working-directory: foundry
        run: |
          npm ci
          npm test
